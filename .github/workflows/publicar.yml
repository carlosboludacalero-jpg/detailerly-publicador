name: Publicar en Instagram
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            publicar.py
            cola.json
            publicado.json
          sparse-checkout-cone-mode: false
      - name: Traer el estado
        run: |
          git fetch -q origin estado && git worktree add -q -B estado estado origin/estado && test -f estado/publicado.json
      - name: Publicar lo que toca
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python publicar.py
      - name: Guardar el estado
        if: always()
        run: |
          cd estado
          git config user.name "publicador" && git config user.email "publicador@users.noreply.github.com"
          git add --sparse publicado.json
          git diff --cached --quiet || git commit -qm "estado"
          git push -q origin HEAD:estado
